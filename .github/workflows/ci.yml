name: BDD Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Chrome UI + API Tests ─────────────────────────────────────────────────
  chrome-tests:
    name: Chrome + API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Cache Selenium Manager drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-${{ hashFiles('**/pom.xml') }}
          restore-keys: selenium-${{ runner.os }}-chrome-

      - name: Run Chrome UI + API tests (headless)
        run: |
          mvn clean test \
            -Dtest=ChromeTests,APITests \
            -Dheadless=true \
            -Dbrowser=chrome \
            -Dallure.results.directory=target/allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-chrome
          path: target/allure-results/
          retention-days: 7

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-chrome
          path: target/cucumber-reports/
          retention-days: 7

  # ── Firefox UI Tests ──────────────────────────────────────────────────────
  firefox-tests:
    name: Firefox Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Cache Selenium Manager drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-firefox-${{ hashFiles('**/pom.xml') }}
          restore-keys: selenium-${{ runner.os }}-firefox-

      - name: Run Firefox UI tests (headless)
        run: |
          mvn clean test \
            -Dtest=FirefoxTests \
            -Dheadless=true \
            -Dbrowser=firefox \
            -Dallure.results.directory=target/allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-firefox
          path: target/allure-results/
          retention-days: 7

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-firefox
          path: target/cucumber-reports/
          retention-days: 7

  # ── Allure Report (merge Chrome + Firefox, deploy to GitHub Pages) ────────
  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [chrome-tests, firefox-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chrome allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: target/allure-results
        continue-on-error: true

      - name: Download Firefox allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: target/allure-results
        continue-on-error: true

      - name: Install Allure CLI 2.24.0
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "${{ github.workspace }}/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Restore Allure history (for TREND)
        run: |
          if [ -d allure-history ]; then
            cp -r allure-history/. target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Generate Allure report
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Save Allure history
        run: |
          mkdir -p allure-history
          cp -r target/allure-report/history/. allure-history/ 2>/dev/null || true

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          publish_branch: gh-pages
