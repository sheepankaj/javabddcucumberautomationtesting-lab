name: BDD Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fix 1: grant the GITHUB_TOKEN enough rights to push to gh-pages
# Also needed for GHCR (packages) and artifact management (actions).
# Note: the repo must also have "Read and write permissions" enabled under
# Settings → Actions → General → Workflow permissions.
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # ── Chrome UI + API Tests ───────────────────────────────────────────────────
  chrome-tests:
    name: Chrome + API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Cache Selenium Manager drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-${{ hashFiles('**/pom.xml') }}
          restore-keys: selenium-${{ runner.os }}-chrome-

      - name: Run Chrome UI + API tests (headless)
        run: |
          mvn clean test \
            -Dtest=ChromeTests,APITests \
            -Dheadless=true \
            -Dbrowser=chrome \
            -Dallure.results.directory=target/allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-chrome
          path: target/allure-results/
          retention-days: 7

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-chrome
          path: target/cucumber-reports/
          retention-days: 7

  # ── Firefox UI Tests ────────────────────────────────────────────────────────
  firefox-tests:
    name: Firefox Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Cache Selenium Manager drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-firefox-${{ hashFiles('**/pom.xml') }}
          restore-keys: selenium-${{ runner.os }}-firefox-

      - name: Run Firefox UI tests (headless)
        run: |
          mvn clean test \
            -Dtest=FirefoxTests \
            -Dheadless=true \
            -Dbrowser=firefox \
            -Dallure.results.directory=target/allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-firefox
          path: target/allure-results/
          retention-days: 7

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-firefox
          path: target/cucumber-reports/
          retention-days: 7

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: automation-tests:${{ github.sha }}
          # Layer caching keeps subsequent builds fast
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Allure Report (merge Chrome + Firefox → GitHub Pages) ──────────────────
  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [chrome-tests, firefox-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fix 2: download each browser's results into its OWN directory so their
      # environment.properties, history/ files, and JSON results don't overwrite
      # each other. We merge them manually before calling allure generate.
      - name: Download Chrome allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-chrome
          path: target/allure-results/chrome
        continue-on-error: true

      - name: Download Firefox allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-firefox
          path: target/allure-results/firefox
        continue-on-error: true

      - name: Merge results into a single directory
        run: |
          mkdir -p target/allure-results/merged
          # Copy Chrome results first (includes environment.properties, history/)
          if [ -d target/allure-results/chrome ]; then
            cp -r target/allure-results/chrome/. target/allure-results/merged/
          fi
          # Copy Firefox results on top — UUID-named JSON files are unique so
          # there is no collision; only environment.properties is overwritten
          # (last writer wins, which is acceptable).
          if [ -d target/allure-results/firefox ]; then
            cp -r target/allure-results/firefox/. target/allure-results/merged/
          fi

      - name: Install Allure CLI 2.24.0
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf allure-2.24.0.tgz
          echo "${{ github.workspace }}/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Restore Allure history (for TREND)
        run: |
          if [ -d allure-history ] && [ "$(ls -A allure-history)" ]; then
            mkdir -p target/allure-results/merged/history
            cp -r allure-history/. target/allure-results/merged/history/
          fi

      - name: Generate Allure report
        run: allure generate target/allure-results/merged --clean -o target/allure-report

      - name: Save Allure history
        run: |
          mkdir -p allure-history
          if [ -d target/allure-report/history ]; then
            cp -r target/allure-report/history/. allure-history/
          fi

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          publish_branch: gh-pages
